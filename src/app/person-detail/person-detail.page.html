
<!--  a few changes from the boilerplate here -->

<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Actor details</ion-title>
  </ion-toolbar>
</ion-header>




<ion-content [fullscreen]="true">


  <!-- // does a quick check to the ts page to see if it's holding any actor details currently -->
  @if (personDetails) {

    <!-- Photo -->
    <div class="person-poster">
      <img [src]="defaultImageUrl + personDetails.profile_path" [alt]="personDetails.name" />
    </div>

    <!-- Info/biograph -->
    <div class="person-info">
      <h1>{{ personDetails.name }}</h1>
      <p class="birthday">Birthday {{ personDetails.birthday }}</p>
      <p class="birthplace">Birthplace {{ personDetails.place_of_birth }}</p>
      <h3>Biography</h3>
      <p class="biography">{{ personDetails.biography }}</p>
    </div>

    <!-- Navigation Buttons -->
    <div class="action-buttons">
      <ion-button (click)="goToCast()">Back to Cast</ion-button>
      <ion-button (click)="goToMovie()">Back to Movie</ion-button>
    </div>

  } @else {

    <div class="no-person">
      <h3>Loading actor, or at least trying to ...</h3>
    </div>

  }

</ion-content>
