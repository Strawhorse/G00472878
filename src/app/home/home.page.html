
<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Homepage</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">


  <!-- Student no. at the top -->
  <div class="name-banner">
    <h2>{{ studentNumber }}</h2>
  </div>


  <!-- Movie list display on homepage -->
<ion-list>

  <!-- <ion-item *ngFor="let movie of movies"> error telling me that this is deprecated, will use newer version-->

  @for (movie of movies; track movie.id) {

  <ion-item>

    <!-- after checking the docs, this keyword 'start' makes the output begin on the left side of this ion-item object -->
    <ion-thumbnail slot="start">      

      <img [src]="imageBaseUrl + movie.poster_path" [alt]="movie.title" />
    </ion-thumbnail>


    <ion-label>
      <h2>{{ movie.title }}</h2>
      <p>{{ movie.release_date }}</p>
    </ion-label>

  </ion-item>
  }
</ion-list>
